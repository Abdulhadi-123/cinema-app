<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Bootstrap RTL CSS -->
  <link id="bootstrap-link" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-info" href="#" id="logo-text">سينما</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-menu nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link text-white active" href="#" id="nav-home" onclick="loadCategory('trending')">الرئيسية</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#" id="nav-movies" onclick="loadCategory('movies')">الأفلام</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#" id="nav-series" onclick="loadCategory('series')">المسلسلات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#" id="nav-favs" onclick="loadCategory('favorites')">
              <span id="nav-fav-text">المفضلة</span> ❤️
            </a>
          </li>
        </ul>

        <!-- User Profile / Auth Area -->
        <div id="auth-container" class="d-flex align-items-center gap-2 my-2 my-lg-0 me-3">
          <button id="login-btn" class="btn btn-outline-info btn-sm">
            <i class="fa-brands fa-google me-1"></i> دخول
          </button>
          <div id="user-info" class="d-none d-flex align-items-center gap-2">
            <img id="user-avatar" src="" alt="User Avatar" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
            <span id="user-name" class="small text-white"></span>
            <button id="logout-btn" class="btn btn-outline-danger btn-sm p-1 px-2" title="تسجيل الخروج">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>

        <!-- Search Form -->
        <form class="d-flex" id="search-form">
          <input class="form-control me-2 bg-dark text-white border-secondary" type="search" id="search-input" placeholder="ابحث عن فيلم أو مسلسل..." aria-label="Search">
          <button class="btn btn-outline-info" type="submit" id="btn-search">بحث</button>
        </form>

        <button class="btn btn-sm btn-secondary ms-2 mt-2 mt-lg-0" id="lang-btn" onclick="toggleLanguage()">English</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-4">
    <h3 class="fw-bold mb-4 border-end border-4 border-info pe-2" id="section-title">المقترحات والأشياء الشائعة 🔥</h3>
    <div class="row" id="movies-grid">
      <!-- Cards will be inserted here dynamically -->
    </div>
  </div>

  <!-- Modal تفاصيل العمل والحلقات والتقييمات -->
  <div class="modal fade" id="movieDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold" id="modalTitle">اسم العمل</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <!-- التبويبات العلويّة -->
          <ul class="nav nav-tabs border-secondary mb-3" id="detailTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active text-light" id="info-tab" data-bs-toggle="tab" data-bs-target="#info-tab-pane" type="button" role="tab">التفاصيل والقصة</button>
            </li>
            <!-- تبويب الحلقات (يظهر مع المسلسلات فقط) -->
            <li class="nav-item d-none" id="episodes-tab-li" role="presentation">
              <button class="nav-link text-light" id="episodes-tab" data-bs-toggle="tab" data-bs-target="#episodes-tab-pane" type="button" role="tab">الحلقات 📺</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link text-light" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews-tab-pane" type="button" role="tab">التقييمات والتعليقات 💬</button>
            </li>
          </ul>

          <!-- محتوى التبويبات -->
          <div class="tab-content" id="detailTabsContent">
            
            <!-- 1. تبويب القصة والإعلان -->
            <div class="tab-pane fade show active" id="info-tab-pane" role="tabpanel">
              <p id="modalOverview" class="text-secondary leading-relaxed"></p>
              <div id="trailerContainer" class="ratio ratio-16x9 mb-3 d-none rounded overflow-hidden">
                <iframe id="trailerIframe" src="" allowfullscreen></iframe>
              </div>
              <h6 class="fw-bold mt-3 mb-2 text-info">طاقم التمثيل:</h6>
              <div id="castContainer" class="d-flex gap-2 overflow-auto pb-2"></div>
            </div>

            <!-- 2. تبويب الحلقات وتقييم الحلقات 📺 -->
            <div class="tab-pane fade" id="episodes-tab-pane" role="tabpanel">
              <div class="d-flex align-items-center justify-content-between mb-3 bg-secondary bg-opacity-25 p-2 rounded">
                <label for="seasonSelect" class="form-label mb-0 fw-bold small text-info">اختر الموسم:</label>
                <select id="seasonSelect" class="form-select form-select-sm bg-dark text-white border-secondary w-auto"></select>
              </div>
              <!-- قائمة الحلقات -->
              <div id="episodesContainer" class="row g-2" style="max-height: 400px; overflow-y: auto;"></div>
            </div>

            <!-- 3. تبويب التعليقات وتقييم العمل الكامل 💬 -->
            <div class="tab-pane fade" id="reviews-tab-pane" role="tabpanel">
              <div class="card bg-secondary bg-opacity-10 border-secondary p-3 mb-3">
                <h6 class="fw-bold text-info mb-2">أضف تقييمك ورأيك للعمل كاملًا:</h6>
                <div class="mb-2">
                  <select id="userRatingInput" class="form-select form-select-sm bg-dark text-warning border-secondary w-auto">
                    <option value="10">⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐ (10/10)</option>
                    <option value="9">⭐⭐⭐⭐⭐⭐⭐⭐⭐ (9/10)</option>
                    <option value="8" selected>⭐⭐⭐⭐⭐⭐⭐⭐ (8/10)</option>
                    <option value="7">⭐⭐⭐⭐⭐⭐⭐ (7/10)</option>
                    <option value="6">⭐⭐⭐⭐⭐⭐ (6/10)</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5/10)</option>
                  </select>
                </div>
                <textarea id="userCommentInput" class="form-control bg-dark text-white border-secondary mb-2" rows="2" placeholder="اكتب رأيك هنا..."></textarea>
                <button id="submitReviewBtn" class="btn btn-sm btn-info text-dark fw-bold">نشر التقييم</button>
              </div>

              <h6 class="fw-bold text-light mb-2"><i class="fa-solid fa-comments me-1"></i> آراء المتابعين:</h6>
              <div id="commentsList" class="d-flex flex-column gap-2" style="max-height: 250px; overflow-y: auto;"></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script type="module" src="firebase-config.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Reg error:', err));
      });
    }
  </script>
</body>
</html>
