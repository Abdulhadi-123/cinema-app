<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer" />
  <title>متتبع الأفلام والمسلسلات | Movie Tracker</title>
  <link rel="icon" type="image/png" href="cinema.png">
  <!-- Bootstrap 5 CSS -->
  <link id="bootstrap-link" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS المخصص -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark py-3 sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-info fs-3 me-3" href="#" onclick="loadCategory('trending')">
        <i class="fa-solid fa-film me-2"></i> <span id="logo-text">سينما</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- روابط التنقل بين الأقسام -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#" id="nav-home" onclick="loadCategory('trending')">الرئيسية (مقترحات)</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="nav-movies" onclick="loadCategory('movies')">الأفلام</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="nav-series" onclick="loadCategory('series')">المسلسلات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="nav-favs" onclick="loadCategory('favorites')">
              <span id="nav-fav-text">المفضلة</span>
            </a>
          </li>
        </ul>

        <!-- البحث + تغيير اللغة + ملف المستخدم -->
        <div class="d-flex align-items-center gap-2 flex-wrap mt-2 mt-lg-0">
          <form class="d-flex" id="search-form">
            <input class="form-control search-input me-2" type="search" id="search-input" placeholder="ابحث..." aria-label="Search">
            <button class="btn btn-search fw-bold px-3" type="submit" id="btn-search">بحث</button>
          </form>

          <!-- زر تغيير اللغة -->
          <button class="btn btn-outline-light ms-2 fw-bold" id="lang-btn" onclick="toggleLanguage()">English</button>

          <!-- زر تسجيل الدخول / بروفايل المستخدم -->
          <div id="user-profile" class="ms-2">
            <button id="login-btn" class="btn btn-primary btn-sm fw-bold">تسجيل الدخول بـ Google</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- محتوى الصفحة -->
  <div class="container my-5">
    <h3 class="mb-4 border-start border-info border-4 ps-2" id="section-title">المقترحات والأشياء الشائعة 🔥</h3>
    
    <!-- شبكة عرض البطاقات -->
    <div class="row g-4" id="movies-grid"></div>
  </div>

  <!-- Modal تفاصيل الفيلم/المسلسل والتريلر والطاقم -->
  <div class="modal fade" id="movieDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content text-light" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
        <div class="modal-header" style="border-bottom-color: var(--border-color);">
          <h5 class="modal-title fw-bold text-info" id="modalTitle">تفاصيل العمل</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- مشغل التريلر (YouTube) -->
          <div id="trailerContainer" class="ratio ratio-16x9 mb-3 d-none">
            <iframe id="trailerIframe" src="" title="Trailer" allowfullscreen class="rounded-3"></iframe>
          </div>
          
          <!-- ملخص القصة -->
          <h6 class="fw-bold text-info mb-2"><i class="fa-solid fa-align-right me-1"></i> القصة</h6>
          <p id="modalOverview" class="text-secondary small mb-4"></p>

          <!-- طاقم التمثيل -->
          <h6 class="fw-bold text-info mb-2"><i class="fa-solid fa-users me-1"></i> طاقم التمثيل</h6>
          <div id="castContainer" class="d-flex flex-wrap gap-3"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer text-center">
    <div class="container">
      <p class="mb-1">
        تطوير وتصميم بواسطة 
        <a href="https://github.com/Abdulhadi-123" target="_blank" rel="noopener noreferrer" class="footer-link">
          عبدالهادي <i class="fa-brands fa-github ms-1"></i>
        </a>
      </p>
      <small class="text-secondary">&copy; 2026 جميع الحقوق محفوظة - Cinema App</small>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase Auth & Firestore Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfeNg330qt5ZM7_eZvbMcgOMpw74Kdnj0",
      authDomain: "cinema-5321b.firebaseapp.com",
      projectId: "cinema-5321b",
      storageBucket: "cinema-5321b.firebasestorage.app",
      messagingSenderId: "286569379324",
      appId: "1:286569379324:web:256b0c9d9f04c0d0ccee79",
      measurementId: "G-BSRJLZXNDC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // تصدير الكائنات إلى النطاق العام (window) لكي نتمكن من الوصول إليها داخل app.js
    window.auth = auth;
    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;

    onAuthStateChanged(auth, (user) => {
      const userProfile = document.getElementById('user-profile');
      if (!userProfile) return;

      if (user) {
        window.currentUser = user;
        userProfile.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <img src="${user.photoURL}" style="width: 35px; height: 35px; border-radius: 50%;">
            <span class="text-white small fw-bold">${user.displayName}</span>
            <button id="logout-btn" class="btn btn-sm btn-outline-danger">خروج</button>
          </div>
        `;
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
        
        // جلب مزامنة المفضلة من السحابة إذا كانت الدالة معرفة في app.js
        if (typeof syncFavoritesFromCloud === 'function') {
          syncFavoritesFromCloud();
        }
      } else {
        window.currentUser = null;
        userProfile.innerHTML = `<button id="login-btn" class="btn btn-primary btn-sm fw-bold">تسجيل الدخول بـ Google</button>`;
        document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
        
        // عند تسجيل الخروج، العودة للتحميل من الـ LocalStorage إذا رغبت
        if (typeof loadLocalFavorites === 'function') {
          loadLocalFavorites();
        }
      }
    });
  </script>

  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
