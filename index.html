<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سينما - Cinema App</title>
  <!-- Bootstrap 5 RTL CSS -->
  <link id="bootstrap-link" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .movie-card { background-color: #1e293b; border-radius: 12px; overflow: hidden; transition: transform 0.2s; border: 1px solid #334155; cursor: pointer; }
    .movie-card:hover { transform: translateY(-5px); }
    .movie-poster { height: 260px; object-fit: cover; width: 100%; }
    .fav-btn, .watched-card-btn { position: absolute; top: 10px; background: rgba(15, 23, 42, 0.75); border: none; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; color: #fff; transition: background 0.2s; z-index: 2; }
    .fav-btn { right: 10px; }
    .watched-card-btn { right: 55px; }
    .fav-btn.active { color: #ef4444; }
    .watched-card-btn.active { color: #22c55e; }
    .rating-badge { position: absolute; bottom: 10px; left: 10px; background: rgba(15, 23, 42, 0.85); padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: bold; color: #fbbf24; z-index: 2; }
    .actor-img { width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 2px solid #38bdf8; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#" onclick="loadCategory('trending')">
        <i class="fa-solid fa-film text-info"></i> <span id="logo-text">سينما</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" id="nav-home" href="#" onclick="loadCategory('trending')">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" id="nav-movies" href="#" onclick="loadCategory('movies')">الأفلام</a></li>
          <li class="nav-item"><a class="nav-link" id="nav-series" href="#" onclick="loadCategory('series')">المسلسلات</a></li>
          <li class="nav-item"><a class="nav-link" id="nav-favs" href="#" onclick="loadCategory('favorites')"><span id="nav-fav-text">المفضلة</span> ❤️</a></li>
        </ul>

        <!-- Search Form -->
        <form class="d-flex gap-2 ms-3" id="search-form">
          <input class="form-control form-control-sm bg-dark text-white border-secondary" type="search" id="search-input" placeholder="ابحث عن فيلم أو مسلسل...">
          <button class="btn btn-sm btn-outline-info" type="submit" id="btn-search">بحث</button>
        </form>

        <!-- Auth & Profile Section -->
        <div class="d-flex align-items-center gap-2 ms-3">
          <button class="btn btn-sm btn-outline-light" id="lang-btn" onclick="toggleLanguage()">English</button>
          <button class="btn btn-sm btn-info fw-bold" id="login-btn" onclick="loginWithGoogle()">تسجيل الدخول</button>
          
          <div id="user-info" class="d-none dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-white gap-2" data-bs-toggle="dropdown">
              <img id="user-avatar" src="" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
              <div class="d-none d-md-block text-start" style="line-height: 1.1;">
                <span id="user-name" class="fw-bold small d-block"></span>
                <span id="user-handle" class="text-secondary" style="font-size: 10px;"></span>
              </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end text-small shadow">
              <li><a class="dropdown-item" href="#" onclick="openProfilePage()"><i class="fa-solid fa-user me-2"></i>الصفحة الشخصية</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="logoutGoogle()"><i class="fa-solid fa-right-from-bracket me-2"></i>تسجيل الخروج</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <div class="container my-4" id="main-content-area">
    <h3 id="section-title" class="fw-bold mb-4 text-white">المقترحات والأشياء الشائعة 🔥</h3>
    <div class="row" id="movies-grid">
      <!-- العناصر تظهر هنا ديناميكياً -->
    </div>
  </div>

  <!-- Profile Page Area (مخفي افتراضياً ويظهر عند النقر على البروفايل) -->
  <div class="container my-4 d-none" id="profile-page-area">
    <div class="row g-4">
      <!-- العمود الجانبي للبروفايل وتعديل الحساب وإعدادات البحث -->
      <div class="col-lg-4">
        <div class="card bg-dark border-secondary p-4 rounded-4 shadow-sm">
          <div class="text-center mb-3">
            <img id="profile-page-avatar" src="" class="rounded-circle border border-info p-1 mb-2 shadow" style="width: 100px; height: 100px; object-fit: cover;">
            <h4 id="profile-page-name" class="fw-bold text-white mb-0"></h4>
            <span id="profile-page-username" class="text-secondary small"></span>
            <div id="profile-page-joined" class="text-muted mt-1" style="font-size: 11px;"></div>
          </div>

          <!-- 🔍 خانة البحث اللحظي عن المستخدمين (زي نظام إنستغرام) -->
          <div class="position-relative mb-4">
            <label class="form-label text-secondary small fw-bold">البحث عن مستخدمين:</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-secondary">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" id="user-search-input" class="form-control bg-dark text-white border-secondary" placeholder="ابحث باسم المستخدم..." autocomplete="off">
            </div>
            <!-- القائمة المنبثقة لنتائج البحث -->
            <div id="user-search-dropdown" class="list-group position-absolute w-100 shadow-lg d-none mt-1" style="z-index: 1050; max-height: 250px; overflow-y: auto; background-color: #1e293b; border: 1px solid #475569;">
              <!-- نتائج البحث تظهر هنا ديناميكياً -->
            </div>
          </div>

          <!-- إحصائيات الحساب -->
          <div class="border-top border-secondary pt-3 mt-2">
            <h6 class="text-info fw-bold mb-3 small">إحصائياتك:</h6>
            <div class="row g-2 text-center">
              <!-- يتم تعبئتها ديناميكياً من app.js -->
            </div>
          </div>

          <!-- نموذج تعديل البروفايل -->
          <form id="profile-form" class="mt-4 pt-3 border-top border-secondary">
            <h6 class="text-white fw-bold mb-3 small">تعديل الملف الشخصي</h6>
            <div class="alert alert-danger d-none py-2 small" id="profile-error"></div>
            <div class="alert alert-success d-none py-2 small" id="profile-success">تم الحفظ بنجاح!</div>
            
            <div class="mb-2">
              <label class="form-label text-secondary" style="font-size: 11px;">اسم المستخدم (Username)</label>
              <input type="text" id="edit-username" class="form-control form-control-sm bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-2">
              <label class="form-label text-secondary" style="font-size: 11px;">الاسم الظاهر</label>
              <input type="text" id="edit-displayname" class="form-control form-control-sm bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-secondary" style="font-size: 11px;">تغيير الصورة الشخصية</label>
              <input type="file" id="edit-avatar-file" class="form-control form-control-sm bg-dark text-white border-secondary" accept="image/*">
            </div>
            <button type="submit" id="save-profile-btn" class="btn btn-info btn-sm w-100 fw-bold text-dark">حفظ التغييرات</button>
          </form>
        </div>
      </div>

      <!-- العمود الرئيسي لأعمال المستخدم ومتابعته -->
      <div class="col-lg-8">
        <div class="card bg-dark border-secondary p-4 rounded-4 shadow-sm h-100">
          <h5 class="fw-bold text-white mb-3"><i class="fa-solid fa-eye text-success me-2"></i>الأعمال التي أتممت مشاهدتها / تابعتها</h5>
          <div class="row" id="profile-watched-grid">
            <!-- الكاردز تظهر هنا -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal تفاصيل الفيلم/المسلسل -->
  <div class="modal fade" id="movieDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold" id="modalTitle">Loading...</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul class="nav nav-tabs border-secondary mb-3" id="detailTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active text-info" id="info-tab" data-bs-toggle="tab" data-bs-target="#infoPane" type="button">التفاصيل</button>
            </li>
            <li class="nav-item d-none" id="episodes-tab-li" role="presentation">
              <button class="nav-link text-info" id="episodes-tab" data-bs-toggle="tab" data-bs-target="#episodesPane" type="button">الحلقات</button>
            </li>
          </ul>
          <div class="tab-content" id="detailTabContent">
            <div class="tab-pane fade show active" id="infoPane" role="tabpanel">
              <p id="modalOverview" class="text-secondary small"></p>
              <div id="trailerContainer" class="ratio ratio-16x9 mb-3 d-none">
                <iframe id="trailerIframe" src="" allowfullscreen></iframe>
              </div>
              <h6 class="fw-bold text-white mb-2">طاقم العمل</h6>
              <div id="castContainer" class="d-flex gap-3 overflow-auto pb-2"></div>
            </div>
            <div class="tab-pane fade" id="episodesPane" role="tabpanel">
              <div class="mb-3">
                <select id="seasonSelect" class="form-select bg-dark text-white border-secondary form-select-sm"></select>
              </div>
              <div class="row g-2 overflow-auto" id="episodesContainer" style="max-height: 400px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal إدخال اسم المستخدم عند التسجيل لأول مرة -->
  <div class="modal fade" id="usernameModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary p-3">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">اختر اسم مستخدم فريد</h5>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none small py-2" id="setup-username-error"></div>
          <form id="setup-username-form">
            <div class="mb-3">
              <label class="form-label text-secondary small">اسم المستخدم (بالإنجليزية بدون مسافات):</label>
              <input type="text" id="setup-username-input" class="form-control bg-dark text-white border-secondary" placeholder="e.g. abdulhadi" required pattern="^[a-zA-Z0-9_]+$">
            </div>
            <button type="submit" class="btn btn-info w-100 fw-bold text-dark">تأكيد ومتابعة</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Firebase SDKs و app.js -->
  <script type="module" src="app.js"></script>
</body>
</html>
